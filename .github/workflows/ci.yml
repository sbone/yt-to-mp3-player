name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test

      - name: Test production build
        run: npm run test:production

      - name: Generate portfolio screenshots
        run: npm run screenshots

      - name: Upload portfolio screenshots
        id: screenshots-artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-screenshots
          path: artifacts/screenshots/*.png
          retention-days: 14

      - name: Summarize screenshots
        run: |
          {
            echo "## Portfolio screenshots"
            echo
            echo "Generated screenshots are attached to this run as the \`portfolio-screenshots\` artifact."
            echo
            find artifacts/screenshots -maxdepth 1 -name '*.png' -print | sort | sed 's#^#- #'
          } >> "$GITHUB_STEP_SUMMARY"
